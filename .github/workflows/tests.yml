name: Tests

on:
  workflow_dispatch:
    inputs:
      rebaseline:
        description: >-
          Regenerate benchmark baselines on this runner and upload them as an
          artifact (skips the regular gates). Download the artifact and commit
          the JSONs to benchmarks/ to adopt them.
        type: boolean
        default: false

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # 07:00 UTC daily → nightly comprehensive run (slow + autodiff_full tests)
    - cron: "0 7 * * *"
    # 06:00 UTC every Monday → weekly public benchmark suite
    - cron: "0 6 * * 1"

# Keyed by ref, event, and — for schedules — the cron that fired. A new push
# or PR update should still supersede the run it replaces, but the two crons
# are both `schedule` on `main`, so a ref-only group put the Monday weekly
# and the daily nightly in one bucket. The weekly notebook tier runs for
# hours and the nightly cron follows about an hour behind it, so the weekly
# was cancelled partway through every time it ran.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule }}
  cancel-in-progress: true

jobs:
  # ── quick suite on every PR / push to main ─────────────────────────────────
  # Installs only the `test` extra (which includes control + pandas — soft deps
  # of library code that lazy-imports them at runtime). Tests needing heavier
  # optional libraries (pysindy, tensorflow, torch, pytwin, ...) skip via
  # pytest.importorskip at collection; the nightly test-full job runs them all.
  quick:
    name: Quick test suite
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && !inputs.rebaseline
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # `mcp` is included so test/mcp/ actually runs: those tests open with
        # `importorskip("mcp")`, so without the extra they skip silently and the
        # MCP server has no coverage at all.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,mcp]"

      - name: Run quick suite (excludes slow, dashboard, autodiff_full)
        run: pytest -q --tb=short -n auto

  # ── autodiff smoke: the small PR-time gradient test set ────────────────────
  autodiff-smoke:
    name: Gradient smoke tests (framework + stateless blocks)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && !inputs.rebaseline
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run autodiff framework + stateless block sweep
        run: |
          pytest -q --tb=short \
            test/autodiff/test_gradient_property_pilot.py \
            test/autodiff/test_block_gradients_stateless.py

  # ── nightly comprehensive (slow + autodiff_full) ───────────────────────────
  # Installs the `test-full` extra which pulls every optional runtime library so
  # the full test matrix (including control, pysindy, mujoco, torch, ...) runs.
  nightly:
    name: Nightly comprehensive suite
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && !inputs.rebaseline
    # The tier runs ~82 min once every optional library is installed and no
    # collection aborts early, which left almost nothing against the old 90.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # cyipopt (pulled in via the `all` extra) builds from source against the
      # system IPOPT library; without it the whole `test-full` install fails.
      - name: Install IPOPT (build dep of cyipopt)
        # coinor-libipopt-dev pulls only the runtime libblas3 / liblapack3, but
        # cyipopt links -lblas -llapack, which needs the unversioned .so
        # symlinks the -dev packages ship.
        run: sudo apt-get update && sudo apt-get install -y coinor-libipopt-dev liblapack-dev libblas-dev

      - name: Install
        # cyipopt is source-only on PyPI, so pip compiles it in an isolated
        # build env that would otherwise pull the newest numpy. The runtime
        # numpy is held at 2.3.x by sysidentpy (via the `recommended` extra),
        # and an extension built against 2.4 headers fails to import against
        # 2.3 ("numpy.dtype size changed"). PIP_CONSTRAINT applies to build
        # environments as well as the main resolve, so both see the same numpy.
        run: |
          python -m pip install --upgrade pip
          echo 'numpy<2.4' > "$RUNNER_TEMP/constraints.txt"
          PIP_CONSTRAINT="$RUNNER_TEMP/constraints.txt" pip install -e ".[test-full]"

      # `notebook` is excluded explicitly: --override-ini drops pytest.ini's
      # addopts (where it is deselected by default), and executing ~95 notebooks
      # belongs to the weekly `notebooks` job, not to this daily one.
      - name: Run full suite (slow + autodiff_full, excludes dashboard + notebooks)
        # Session cap below the job cap, so an overrun still prints its summary
        # instead of being killed mid-write with the log lost.
        run: |
          pytest -q --tb=short \
            --session-timeout=8100 \
            -m "not dashboard and not notebook" \
            --override-ini="addopts=--strict-markers"

  # ── compile-time regression gate ──────────────────────────────────────────
  # Re-runs the compile-time benchmark and fails if any case regresses beyond
  # the threshold encoded in benchmarks/compile_time.py (currently +50 %).
  # The check tolerates SKIPPED cases (e.g. when an optional dep is missing)
  # so it never blocks PRs on environment drift.
  compile-time:
    name: Compile-time regression gate
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && !inputs.rebaseline
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run compile-time benchmark with --check
        run: python benchmarks/compile_time.py --check

  # ── FMU official-validator gate (T-026c) ──────────────────────────────────
  # Validates every FMU produced by build_fmu with the official checkers:
  # fmpy.validate_fmu (hard gate, zero findings) and VDMCheck2 (the strict
  # INTO-CPS static VDM-SL checker of modelDescription.xml — JVM-based, so
  # it runs here with a cached distribution rather than in the quick suite).
  fmu-validators:
    name: FMU official validators
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && !inputs.rebaseline
    env:
      VDMCHECK_VERSION: "1.1.3"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java 17 (for VDMCheck)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache VDMCheck distribution
        id: vdmcheck-cache
        uses: actions/cache@v4
        with:
          path: ~/vdmcheck
          key: vdmcheck2-${{ env.VDMCHECK_VERSION }}

      - name: Download VDMCheck2
        if: steps.vdmcheck-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/vdmcheck
          curl -sSL -o ~/vdmcheck/vdmcheck2.zip \
            "https://github.com/INTO-CPS-Association/FMI-VDM-Model/releases/download/Release/${VDMCHECK_VERSION}/vdmcheck2-${VDMCHECK_VERSION}-distribution-rules.zip"
          unzip -o ~/vdmcheck/vdmcheck2.zip -d ~/vdmcheck

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,fmu]"

      - name: Run official-validator suite
        run: |
          set -o pipefail  # pytest's failure must not be masked by tee
          VDMCHECK2="$(find ~/vdmcheck -name 'VDMCheck2.sh' | head -1)"
          export VDMCHECK2
          echo "Using VDMCHECK2=$VDMCHECK2"
          pytest -q --tb=short \
            test/library/test_t_026c_fmu_official_validation.py \
            | tee fmu_validation.log

      - name: Publish validation summary
        if: always()
        run: |
          {
            echo "## FMU official-validator results (T-026c)"
            echo ""
            echo '| Check | Result |'
            echo '|---|---|'
            tail -3 fmu_validation.log | head -1 | \
              sed 's/^/| pytest summary | /; s/$/ |/'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── FMU interoperability gate ─────────────────────────────────────────────
  # The static validators (fmpy.validate_fmu, VDMCheck) read
  # modelDescription.xml and never load the platform binary, so an FMU that
  # cannot be instantiated at all passes them clean. This job covers what they
  # cannot, in both directions:
  #
  #   import — the FMI Reference FMUs, co-simulation and model exchange, in
  #            FMI 2.0 and 3.0. Previously opt-in behind a locally built
  #            corpus; built here so it gates every push.
  #   export — an FMU we produced, run by fmusim (the Modelica Association's
  #            reference simulator, Rust, no Python in the process).
  #
  # The wrapper build is part of the gate, not setup: the wrapper pythonfmu
  # ships links no libpython, and an export made with it fails in every
  # non-Python master while the validators stay green.
  fmu-interop:
    name: FMU interoperability (Reference FMUs + fmusim)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && !inputs.rebaseline
    env:
      REFERENCE_FMUS_VERSION: "v0.0.39"
      FMUSIM_VERSION: "0.6.0"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache the Reference-FMU corpus
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: ~/.fmu-corpus
          key: reference-fmus-${{ env.REFERENCE_FMUS_VERSION }}-${{ runner.os }}

      - name: Build the Reference FMUs
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$REFERENCE_FMUS_VERSION" \
            https://github.com/modelica/Reference-FMUs.git ~/reference-fmus
          cd ~/reference-fmus
          # Build only the models the suites use. The corpus compiles with
          # -Werror, and its Resource example trips -Wstringop-truncation on
          # gcc 12+; naming targets sidesteps upstream's warning policy
          # deciding whether this gate can run, and is faster besides.
          # StateSpace is FMI 3 only (array variables are an FMI 3 feature).
          MODELS="BouncingBall VanDerPol Dahlquist Stair Feedthrough"
          # Clocks is FMI 3 scheduled-execution, which the corpus suite
          # asserts we reject rather than import; building it keeps that
          # check from skipping.
          cmake -B b2 -DFMI_VERSION=2 -DCMAKE_BUILD_TYPE=Release
          cmake --build b2 --config Release --target $MODELS
          cmake -B b3 -DFMI_VERSION=3 -DCMAKE_BUILD_TYPE=Release
          cmake --build b3 --config Release --target $MODELS StateSpace Clocks
          mkdir -p ~/.fmu-corpus/2.0 ~/.fmu-corpus/3.0
          cp b2/fmus/*.fmu ~/.fmu-corpus/2.0/
          cp b3/fmus/*.fmu ~/.fmu-corpus/3.0/

      - name: Cache fmusim
        id: fmusim-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/fmusim
          key: fmusim-${{ env.FMUSIM_VERSION }}-${{ runner.os }}

      - name: Install fmusim
        if: steps.fmusim-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL -o /tmp/fmusim.zip \
            "https://github.com/modelica/fmusim/releases/download/v${FMUSIM_VERSION}/fmusim-x86_64-linux.zip"
          unzip -o /tmp/fmusim.zip -d /tmp/fmusim
          install -m 0755 "$(find /tmp/fmusim -type f -name fmusim | head -1)" ~/.local/bin/fmusim

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,fmu]"

      - name: Build a loadable PythonFMU wrapper
        # Without this the export half of the gate cannot run at all: the
        # bundled wrapper leaves libpython unresolved, so fmusim fails at
        # dlopen. The script self-verifies and exits non-zero if the result
        # still fails either check.
        run: bash scripts/build_pythonfmu_wrapper.sh

      - name: Run the interoperability suite
        run: |
          set -o pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export JAXONOMY_FMU_CORPUS="$HOME/.fmu-corpus"
          pytest -q --tb=short -m slow \
            test/library/test_fmu_reference_corpus.py \
            test/library/test_fmu_me_import.py \
            test/library/test_fmu_fmusim_master.py \
            | tee fmu_interop.log

      - name: Publish interoperability summary
        if: always()
        run: |
          {
            echo "## FMU interoperability results"
            echo ""
            echo "Reference FMUs \`${REFERENCE_FMUS_VERSION}\`, fmusim \`${FMUSIM_VERSION}\`."
            echo ""
            echo '| Check | Result |'
            echo '|---|---|'
            tail -3 fmu_interop.log | head -1 | \
              sed 's/^/| pytest summary | /; s/$/ |/'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── memory regression gate ────────────────────────────────────────────────
  # Re-runs the memory benchmark and fails if any case's peak RSS regresses
  # beyond the threshold encoded in benchmarks/memory.py (currently +50 %).
  # Same trigger pattern as compile-time (PR + push to main, NOT scheduled).
  memory:
    name: Memory regression gate
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && !inputs.rebaseline
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run memory benchmark with --check
        run: python benchmarks/memory.py --check

  # ── shipped-notebook execution (weekly + manual only) ─────────────────────
  # docs/** is a shippable surface, but a notebook's committed outputs keep
  # rendering correctly on the docs site long after the code beneath them stops
  # running — so drift there is invisible until a user hits it. This executes
  # every notebook in the manifest against the current API.
  #
  # Weekly rather than nightly: ~95 notebooks is far too much to run daily, and
  # the `notebook` marker is deselected in pytest.ini's addopts so the nightly
  # job's cost is unchanged. The PR-time gate is the small smoke tier, which is
  # unmarked and runs in the quick suite.
  notebooks:
    name: Weekly shipped-notebook execution suite
    runs-on: ubuntu-latest
    if: >-
      ((github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1')
      || github.event_name == 'workflow_dispatch')
      && !inputs.rebaseline
    # Four notebooks dominate: booster_part_4 alone runs ~41 min and
    # battery_part_3 over 40 min (measured serially, uncontended). They are
    # single serial chains, so -n auto cannot shorten them and the slowest one
    # sets the floor. Nothing waits on this job, so it gets room rather than a
    # tight cap; GitHub's own per-job ceiling is 6 h, which this now sits at.
    # The whole tier reached 79 % in 240 min once every notebook actually
    # executed, so 240 was sized for a run where a third of them aborted early.
    timeout-minutes: 360
    # The mujoco notebooks render offscreen. The runner has no display, so
    # mujoco needs a software GL backend named up front; without one it aborts
    # with "an OpenGL platform library has not been loaded into this process".
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # cyipopt (via the `all` extra, used by the booster / limit-cycle
      # notebooks) builds from source against the system IPOPT library.
      - name: Install IPOPT (build dep of cyipopt)
        # coinor-libipopt-dev pulls only the runtime libblas3 / liblapack3, but
        # cyipopt links -lblas -llapack, which needs the unversioned .so
        # symlinks the -dev packages ship.
        run: sudo apt-get update && sudo apt-get install -y coinor-libipopt-dev liblapack-dev libblas-dev libosmesa6-dev

      - name: Install
        # cyipopt is source-only on PyPI, so pip compiles it in an isolated
        # build env that would otherwise pull the newest numpy. The runtime
        # numpy is held at 2.3.x by sysidentpy (via the `recommended` extra),
        # and an extension built against 2.4 headers fails to import against
        # 2.3 ("numpy.dtype size changed"). PIP_CONSTRAINT applies to build
        # environments as well as the main resolve, so both see the same numpy.
        run: |
          python -m pip install --upgrade pip
          echo 'numpy<2.4' > "$RUNNER_TEMP/constraints.txt"
          PIP_CONSTRAINT="$RUNNER_TEMP/constraints.txt" pip install -e ".[test-full]"

      # ffmpeg backs the matplotlib animation writers a few notebooks use. It
      # is preinstalled on ubuntu-latest; verify rather than assume, since the
      # manifest skips those notebooks when it is absent and a silent skip
      # would look like a pass.
      - name: Verify ffmpeg is present
        run: ffmpeg -version | head -1

      - name: Execute shipped notebooks
        # --durations reports the slowest notebooks under the contended -n auto
        # run, which is the only place their real cost is visible; the manifest
        # timeouts are sized from these numbers rather than from serial local
        # measurements. -rA keeps every failure's traceback: with -n auto the
        # default short summary drops most of them, which makes a red run
        # undiagnosable from the log alone.
        # --session-timeout sits below the job's timeout-minutes so pytest ends
        # the session itself and still prints the summary, tracebacks and
        # durations. When the job cap hits first the runner kills pytest
        # mid-write and the whole log is lost, which is no use for sizing the
        # per-notebook budgets.
        run: |
          pytest -q --tb=short -n auto -rA --durations=25 \
            --session-timeout=19800 \
            -m notebook \
            --override-ini="addopts=--strict-markers" \
            test/docs/

  # ── public benchmark suite (weekly + manual only) ─────────────────────────
  # Cartpole / quadruped / sysid / linearization. NOT on PR or push: each
  # full run takes several minutes (the sysid step alone is ~7 s on CPU and
  # the quadruped batch needs a fresh XLA compile).  The compile/memory
  # gates above are the per-PR backstop; this one runs weekly to track
  # public-facing throughput numbers and is also available on
  # workflow_dispatch for manual re-baselining.
  public-benchmarks:
    name: Weekly public benchmark suite (cartpole / quadruped / sysid)
    runs-on: ubuntu-latest
    if: >-
      ((github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1')
      || github.event_name == 'workflow_dispatch')
      && !inputs.rebaseline
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run public benchmark suite with --check
        run: python benchmarks/public.py --check

      - name: Upload baseline JSON as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: public-benchmark-baseline
          path: benchmarks/public_baseline.json
          if-no-files-found: ignore

  # ── benchmark rebaseline (manual only) ────────────────────────────────────
  # The compile-time / memory / public baselines must be recorded on the same
  # hardware the gates run on (ubuntu-latest). Trigger this via
  # workflow_dispatch with `rebaseline: true`, download the artifact, and
  # commit the three JSONs to benchmarks/. public.py merges into the existing
  # file, so non-CPU device columns (gpu_t4, ...) are preserved.
  rebaseline:
    name: Regenerate benchmark baselines on CI hardware
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.rebaseline
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Regenerate compile-time baseline
        run: python benchmarks/compile_time.py

      - name: Regenerate memory baseline
        run: python benchmarks/memory.py

      - name: Regenerate public benchmark baseline (cpu column)
        run: python benchmarks/public.py

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v5
        with:
          name: ci-benchmark-baselines
          path: |
            benchmarks/compile_time_baseline.json
            benchmarks/memory_baseline.json
            benchmarks/public_baseline.json

  # ── public-benchmarks GPU job (DISABLED: needs self-hosted runners) ───────
  # Uncomment when GPU runners are provisioned. Requires
  #   `runs-on: [self-hosted, linux, gpu]`
  # plus a runner labelled with the actual accelerator (`t4`/`a100`/`h100`).
  # The matrix below populates `gpu_t4` / `gpu_a100` / `gpu_h100` columns in
  # benchmarks/public_baseline.json — these columns are independent of the
  # CPU-only `public-benchmarks` job above and never block CPU CI.
  #
  # public-benchmarks-gpu:
  #   name: Weekly public benchmark suite on GPU
  #   if: github.event_name == 'workflow_dispatch'
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       include:
  #         - device_key: gpu_t4
  #           runs_on: [self-hosted, linux, gpu, t4]
  #         - device_key: gpu_a100
  #           runs_on: [self-hosted, linux, gpu, a100]
  #         - device_key: gpu_h100
  #           runs_on: [self-hosted, linux, gpu, h100]
  #   runs-on: ${{ matrix.runs_on }}
  #   timeout-minutes: 45
  #   env:
  #     JAXONOMY_BENCH_DEVICE: gpu
  #   steps:
  #     - uses: actions/checkout@v5
  #       with:
  #         lfs: true
  #     - name: Set up Python 3.11
  #       uses: actions/setup-python@v6
  #       with:
  #         python-version: "3.11"
  #         cache: pip
  #     - name: Install (with CUDA-flavour JAX)
  #       run: |
  #         python -m pip install --upgrade pip
  #         pip install -e ".[test]" "jax[cuda12]"
  #     - name: Run public benchmark suite (--device gpu, --check)
  #       run: python benchmarks/public.py --device gpu --check
  #     - name: Update GPU column in baseline (workflow_dispatch only)
  #       if: github.event_name == 'workflow_dispatch'
  #       run: |
  #         python benchmarks/public.py \
  #           --device gpu --update-baseline ${{ matrix.device_key }}
  #     - name: Upload updated baseline JSON
  #       if: always()
  #       uses: actions/upload-artifact@v5
  #       with:
  #         name: public-benchmark-baseline-${{ matrix.device_key }}
  #         path: benchmarks/public_baseline.json
  #         if-no-files-found: ignore
